name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils ca-certificates clang curl file g++ make perl \
            libssl-dev libargon2-dev zlib1g-dev
      - name: GCC build and test
        run: make check
      - name: Sanitizers
        run: |
          make sanitize
          ldd arborkdf-tests-sanitize | grep -Eq 'libasan|libclang_rt.asan'
          ldd arborkdf-tests-sanitize | grep -Eq 'libubsan|libclang_rt.ubsan'
      - name: Clang build and test
        run: |
          make clean
          make CXX=clang++ check
      - name: Static build
        run: |
          make clean
          make static-check
      - name: Verify static executable
        run: |
          file arborkdf-static
          file arborkdf-static | grep -q "statically linked"
          ! readelf -lW arborkdf-static | grep -q 'INTERP'
          ! readelf -dW arborkdf-static | grep -q 'NEEDED'
          printf '%s  %s\n' \
            'a8c0d28a529ca480f9f36cf5792e2cd21984552a3c8e4aa11a24aa31aeac98e8' \
            '.deps/downloads/openssl-3.5.7.tar.gz' | sha256sum --check -
          grep -Eq '^# *define OPENSSL_VERSION_STR "3\.5\.7"$' \
            .deps/openssl-3.5.7-linux-x86_64-static/include/openssl/opensslv.h

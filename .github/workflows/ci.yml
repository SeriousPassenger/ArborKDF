name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang g++ make libssl-dev libargon2-dev zlib1g-dev
      - name: GCC build and test
        run: make check
      - name: Sanitizers
        run: |
          make sanitize
          ldd arborkdf-tests-sanitize | grep -Eq 'libasan|libclang_rt.asan'
          ldd arborkdf-tests-sanitize | grep -Eq 'libubsan|libclang_rt.ubsan'
      - name: Clang build and test
        run: |
          make clean
          make CXX=clang++ check
      - name: Static build
        run: |
          make clean
          make STATIC=1 check
      - name: Verify static executable
        run: |
          file arborkdf-static
          file arborkdf-static | grep -q "statically linked"
